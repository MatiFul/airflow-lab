x-airflow-image: &airflow-image
  image: data-qa-airflow:3.2.1
  build:
    context: .
    dockerfile: Dockerfile

services:
  airflow-postgres:
    image: postgres:16
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  airflow-init:
    <<: *airflow-image
    container_name: airflow_init
    depends_on:
      - airflow-postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/simple_auth_manager_passwords.json"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: "data-qa-lab-airflow-secret"
    volumes:
      - ../dags:/opt/airflow/dags
      - "../logs airflow:/opt/airflow/logs"
      - ../plugins:/opt/airflow/plugins
      - ../../data-qa-lab/sql:/opt/airflow/sql
      - ../../data-qa-lab/data_generator/output:/opt/airflow/data
      - ../simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
    command: >
      bash -c "
      airflow db migrate
      "

  airflow-apiserver:
    <<: *airflow-image
    container_name: airflow_apiserver
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/simple_auth_manager_passwords.json"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: "data-qa-lab-airflow-secret"
    volumes:
      - ../dags:/opt/airflow/dags
      - "../logs airflow:/opt/airflow/logs"
      - ../plugins:/opt/airflow/plugins
      - ../../data-qa-lab/sql:/opt/airflow/sql
      - ../../data-qa-lab/data_generator/output:/opt/airflow/data
      - ../simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
    ports:
      - "8081:8080"
    command: api-server

  airflow-scheduler:
    <<: *airflow-image
    container_name: airflow_scheduler
    depends_on:
      - airflow-init
      - airflow-apiserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/simple_auth_manager_passwords.json"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: "data-qa-lab-airflow-secret"
      QA_DB_HOST: qa_lab_postgres
      QA_DB_PORT: "5432"
      QA_DB_NAME: qa_lab
      QA_DB_USER: qa_user
      QA_DB_PASSWORD: qa_pass
    volumes:
      - ../dags:/opt/airflow/dags
      - "../logs airflow:/opt/airflow/logs"
      - ../plugins:/opt/airflow/plugins
      - ../../data-qa-lab/sql:/opt/airflow/sql
      - ../../data-qa-lab/data_generator/output:/opt/airflow/data
      - ../../data-qa-lab/dbt:/opt/airflow/data-qa-lab/dbt:ro
      - ../../data-qa-lab/tests:/opt/airflow/data-qa-lab/tests:ro
      - ../../data-qa-lab/pytest.ini:/opt/airflow/data-qa-lab/pytest.ini:ro
      - ../simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
    command: scheduler

  airflow-dag-processor:
    <<: *airflow-image
    container_name: airflow_dag_processor
    depends_on:
      - airflow-init
      - airflow-apiserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/simple_auth_manager_passwords.json"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: "data-qa-lab-airflow-secret"
    volumes:
      - ../dags:/opt/airflow/dags
      - "../logs airflow:/opt/airflow/logs"
      - ../plugins:/opt/airflow/plugins
      - ../../data-qa-lab/sql:/opt/airflow/sql
      - ../../data-qa-lab/data_generator/output:/opt/airflow/data
      - ../simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
    command: dag-processor

volumes:
  airflow-postgres-data:

networks:
  default:
    external: true
    name: om-lab_app_net
